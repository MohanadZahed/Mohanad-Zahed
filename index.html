<!doctype html>

    <meta charset="UTF-8" />

      content="Mohanad Zahed — Software Architect Frontend / Senior Frontend Engineer. Angular, React, micro-frontends, headless commerce."
    />
    <link rel="canonical" href="https://www.mohanadzahed.com/" />

    <!-- Favicon set — the MOZ brand mark reduced to "MO" (cream M + gold O +
         circuit underline on black). Generated from Archivo Bold outlines, so
         the SVG carries no webfont dependency. favicon.ico holds 16/32/48; the
         16px member drops the node + end circles, which turn to mud at that size.
         Keep favicon.ico at the public root — Google's crawler probes
         /favicon.ico directly for the search-result icon. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (link previews on LinkedIn, Slack, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.mohanadzahed.com/" />
    <meta property="og:title" content="Mohanad Zahed — Frontend Architect" />
    <meta
      property="og:description"
      content="Mohanad Zahed — Software Architect Frontend / Senior Frontend Engineer. Angular, React, micro-frontends, headless commerce."
    />
    <meta property="og:image" content="https://www.mohanadzahed.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Mohanad Zahed" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />

    <!-- Twitter / X card -->

      name="twitter:description"
      content="Mohanad Zahed — Software Architect Frontend / Senior Frontend Engineer. Angular, React, micro-frontends, headless commerce."
    />
    <meta name="twitter:image" content="https://www.mohanadzahed.com/og-image.png" />

    <!-- Structured data: Person (Google knowledge / rich results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mohanad Zahed",
        "jobTitle": "Software Architect Frontend / Senior Frontend Engineer",
        "url": "https://www.mohanadzahed.com/",
        "email": "mailto:mzahed-p@outlook.com",
        "image": "https://www.mohanadzahed.com/og-image.png",
        "sameAs": ["https://www.linkedin.com/in/m-zahed/"],
        "knowsLanguage": ["ar", "en", "de"],
        "address": { "@type": "PostalAddress", "addressCountry": "DE" }
      }
    </script>

    <!-- The hero avatar gates the intro veil (App.tsx HeroIntroGate), but three's
         FileLoader can only request it after the JS bundle parses and React mounts.
         Preloading starts it in parallel with the bundle (~150 ms vs ~530 ms),
         shortening the dark hold.
         `crossorigin` is REQUIRED, not optional: without it the preload is a
         no-cors request that three's cors-mode fetch() can't reuse, so the 2.9 MB
         GLB downloads TWICE. Verify in the Network panel after touching this.
         Knowledge-only assets are deliberately NOT preloaded here — they'd join
         useProgress and hold the veil. See src/scene/Scene.tsx →
         KNOWLEDGE_WARMUP_DELAY_S. -->
    <link rel="preload" href="/models/avatar.glb" as="fetch" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Active: Archivo + Roboto Mono share one link tag -->
